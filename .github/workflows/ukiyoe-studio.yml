name: "Ukiyo-e Studio: сборка"

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/tokyo-ukiyoe-film"

permissions:
  contents: write # publishing the installers to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              ukiyoe-studio/dist/*.exe
          - os: macos-latest
            script: dist:mac
            files: ukiyoe-studio/dist/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: ukiyoe-studio/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ukiyoe-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ukiyoe-studio/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ukiyoe-studio-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
      - name: Версия программы
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ukiyo-e Studio ${{ steps.v.outputs.version }}
          make_latest: "true"
          overwrite_files: true
          files: ${{ matrix.files }}
          body: |
            **Ukiyo-e Studio** — офлайн-программа для фильмов в стиле японской гравюры укиё-э.

            ### Windows
            Скачайте **UkiyoeStudio-Setup-…exe**, запустите и пройдите установку: появятся ярлыки на рабочем столе и в меню «Пуск».
            Программа не подписана сертификатом, поэтому Windows может показать окно «Система Windows защитила ваш компьютер».
            Нажмите **«Подробнее» → «Выполнить в любом случае»**.
            Без установки можно запустить **UkiyoeStudio-Portable-…exe**.

            ### macOS
            Откройте `.dmg` и перетащите программу в «Программы». В первый раз запускайте её правой кнопкой мыши → «Открыть».

            ### Linux
            Скачайте `.AppImage`, выполните `chmod +x`, затем запустите.

            Интернет программе не нужен.
